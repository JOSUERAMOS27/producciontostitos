<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* Conecta la app con Firebase: login con Google y base de datos Firestore */
(function(){
  const box=document.getElementById("login"),app=document.getElementById("app"),msg=document.getElementById("loginMsg");
  let resolveDb;const dbReady=new Promise(r=>resolveDb=r);
  window.claude={use:async n=>{
    if(n==="db")return dbReady;
    if(n==="downloads")return {save:async({filename,data})=>{const b=new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return{status:"saved"}}};
    return null}};
  if(!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey){box.hidden=false;document.getElementById("loginBtn").hidden=true;msg.textContent="Falta configurar Firebase (config.js).";return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth=firebase.auth(),fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  const MSG={"auth/popup-closed-by-user":"Cerraste la ventana de Google antes de terminar. Intenta de nuevo.","auth/cancelled-popup-request":"","auth/unauthorized-domain":"Este sitio no está autorizado en Firebase (Authentication > Configuración > Dominios autorizados).","auth/operation-not-allowed":"El acceso con Google no está activado en Firebase (Authentication > Método de acceso).","auth/network-request-failed":"No hay conexión a internet. Revisa tu conexión e intenta de nuevo.","auth/internal-error":"Google no respondió. Intenta de nuevo."};
  const showErr=e=>{const c=e&&e.code||"";msg.textContent=(c in MSG?MSG[c]:"No se pudo entrar ("+c+"). "+(e&&e.message||""))};
  const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
  auth.getRedirectResult().catch(showErr);
  document.getElementById("loginBtn").onclick=()=>{msg.textContent="Abriendo Google…";
    // Si el login no termina, casi siempre es la protección de rastreo del navegador bloqueando a Google
    const slow=setTimeout(()=>{if(msg.textContent==="Abriendo Google…")msg.textContent="¿Se quedó esperando? Tu navegador puede estar bloqueando el inicio de sesión de Google. En Edge: toca el candado junto a la dirección, apaga \"Prevención de seguimiento\" para este sitio y recarga. También puedes usar Chrome."},20000);
    auth.signInWithPopup(provider).then(()=>{clearTimeout(slow);if(msg.textContent==="Abriendo Google…")msg.textContent=""}).catch(e=>{clearTimeout(slow);
      // Si el navegador bloquea la ventana emergente (común en celulares), entra con redirección
      if(e&&["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(e.code)){auth.signInWithRedirect(provider).catch(showErr);return}
      showErr(e)})};
  document.getElementById("logoutBtn").onclick=()=>auth.signOut().then(()=>location.reload());
  let started=false;
  let denied="";
  auth.onAuthStateChanged(async u=>{
    if(!u){box.hidden=false;app.hidden=true;if(denied){msg.innerHTML="";const b=document.createElement("b");b.textContent=denied;msg.append("El correo ",b," no está autorizado para usar Tostitos. Entra con el correo registrado o pide que lo agreguen en las reglas de Firebase.");denied=""}return}
    msg.textContent="Revisando tu acceso…";
    try{await fs.collection("ajustes").limit(1).get({source:"server"})}
    catch(e){if(e&&e.code==="permission-denied"){denied=u.email||"(sin correo)";await auth.signOut();return}} // sin internet: deja entrar con lo guardado
    msg.textContent="";box.hidden=true;app.hidden=false;document.getElementById("who").textContent=u.email||"";
    if(!started){started=true;resolveDb(fs)}
  });
})();
</script>
